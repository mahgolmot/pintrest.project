  <body>
    <header class="header">
      <div class="header--explore">
        <div class="header_logo">
          <a href="/" aria-label="Pinterest homepage">

              src="https://res.cloudinary.com/dxqm2evux/image/upload/v1756765432/logo_tpjb5k.png"

          <a href="/">Pinterest</a>

      <div class="header_searchBox">
        <input
          type="search"

          placeholder="Search for easy dinners, fashion, etc"
        />
      </div>

      <div class="header_buttons">

    <main>
      <!-- explore for Pinterest -->

      <section class="explore_best">

          <div class="explore_card">

            />

          </div>
          <div class="explore_card">
            <img
              src="https://res.cloudinary.com/dxqm2evux/image/upload/v1759044821/toastFood_qil6pd.jpg"
              alt="snakes"
            />
            <p>Power Happen</p>
            <h3>Snacks für die Lernpause</h3>

        </div>
        <a href="/seemore">See more</a>
